name: ci

# A pull request used to run everything twice: once for the push to its
# branch and once for the pull request itself, two full runs of the same
# commit competing for runners. The branch push is the one that goes.
on:
  push:
    branches: [main]
  pull_request:

# A push to a branch supersedes the run before it: the old one is
# cancelled rather than finishing behind the new one. A push to main is
# never cancelled, so every merge gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: compile, Gleam, Elm, Elixir
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.2"
          gleam-version: "1.13.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('assets/elm.json') }}

      - run: npm ci
      - name: Hex, rebar and the mix_gleam archive
        run: mix local.hex --force && mix local.rebar --force && mix archive.install hex mix_gleam 0.6.2 --force
      - run: mix deps.get
      - run: mix compile
      - name: Gleam unit, rules, property and golden tests
        run: bin/test-gleam
      - name: Fixture payloads for elm-test
        run: mix oskol.fixtures payloads
      - name: Elm typecheck
        run: cd assets && ../node_modules/.bin/elm make src/Main.elm --output=/dev/null
      - name: Elm tests
        run: cd assets && ../node_modules/.bin/elm-test --compiler ../node_modules/.bin/elm
      - name: Elixir tests
        # Including the slow ones a laptop skips: whole matches played out
        # at random, and clocks that have to run out in real time.
        run: mix test --include slow
      - name: Formatting
        run: mix format --check-formatted && gleam format --check src test

  # Runs alongside the suites, not after them: the two are independent,
  # and CI is green when both are. A red answer comes in the time of the
  # slower job, not the sum.
  browser:
    name: Playwright smokes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.2"
          gleam-version: "1.13.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: mix-${{ runner.os }}-

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Hex, rebar and the mix_gleam archive
        run: mix local.hex --force && mix local.rebar --force && mix archive.install hex mix_gleam 0.6.2 --force
      - run: mix deps.get
      - run: mix assets.build
      - name: Dev database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet
      - name: Start the server
        run: |
          mix phx.server > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:4400/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4400/ || (cat server.log && exit 1)
      # The same smokes bin/check --browser runs, in the same order. They
      # share one server, so they are steps rather than a matrix; a matrix
      # across runners is dev-fast-loop's.
      - run: node playwright/test-spa-landing/test.js
      - run: node playwright/test-backgammon-smoke/test.js
      - run: node playwright/test-backgammon-drag/test.js
      - run: node playwright/test-backgammon-board/test.js
      - run: node playwright/test-backgammon-landscape/test.js
      # Arranges its own danced room (mix run setup.exs).
      - run: node playwright/test-backgammon-dance/test.js
      # Arranges its own finished match (mix run setup.exs); the analysis is
      # stubbed in the browser, so no engine is needed.
      - run: node playwright/test-backgammon-replay/test.js
      - run: node playwright/test-guest-prefill/test.js
      # Signing in by email; the mail is read from /dev/last-login.
      - run: node playwright/test-accounts/test.js
      - name: Server log
        if: failure()
        run: cat server.log
