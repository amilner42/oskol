name: ci

# A pull request used to run everything twice: once for the push to its
# branch and once for the pull request itself, two full runs of the same
# commit competing for runners. The branch push is the one that goes.
on:
  push:
    branches: [main]
  pull_request:

# A push to a branch supersedes the run before it: the old one is
# cancelled rather than finishing behind the new one. A push to main is
# never cancelled, so every merge gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: compile, Gleam, Elm
    # Keep runner migrations deliberate; Ubuntu 26 compatibility belongs in
    # its own reviewed change rather than arriving through ubuntu-latest.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.2"
          gleam-version: "1.13.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Cache mix deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Cache Elm packages
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('assets/elm.json') }}

      - run: npm ci
      - name: Production dependency audit
        run: npm run audit:production
      # The remaining advisories are in esbuild-plugin-elm's dev-only
      # compiler chain; the production gate above remains the merge blocker.
      - name: Full dependency audit (informational)
        continue-on-error: true
        run: npm run audit:full
      - name: Hex, rebar and the mix_gleam archive
        run: mix local.hex 2.5.1 --force && mix local.rebar --force && mix archive.install hex mix_gleam 0.6.2 --force
      - run: mix deps.get
      - run: mix compile
      - name: Production release excludes test-only Gleam
        run: bin/check-prod-release
      - name: Shipped Hex dependency audit
        run: bin/check-hex-advisories
      - name: Gleam unit, rules, property and golden tests
        run: bin/test-gleam
      - name: Fixture payloads for elm-test
        run: mix oskol.fixtures payloads
      - name: Elm typecheck
        run: cd assets && ../node_modules/.bin/elm make src/Main.elm --output=/dev/null
      - name: Elm tests
        run: cd assets && ../node_modules/.bin/elm-test --compiler ../node_modules/.bin/elm
      - name: Formatting
        run: mix format --check-formatted && gleam format --check src test

  # The Elixir suite was the longest step in the job above (~3m of its ~7m)
  # and nothing else there waits on it, so it runs as four partitions here
  # instead. ExUnit splits the files; each partition gets its own database
  # (config/test.exs keys the name on MIX_TEST_PARTITION), so nothing is
  # shared and the tests that must not be async stay exactly as they are.
  #
  # Only MIX_TEST_PARTITION is set. `bin/test-par` also sets
  # MIX_TEST_PARTITIONS, which makes each partition take a share of one
  # machine's connections and schedulers -- right when four of them run on a
  # laptop, wrong here, where every partition has a runner and a Postgres to
  # itself and should use all of it.
  elixir:
    name: Elixir tests (${{ matrix.partition }}/4)
    runs-on: ubuntu-24.04
    strategy:
      # One partition failing should not cancel the rest: the useful answer
      # is everything that is broken, not the first thing.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.2"
          gleam-version: "1.13.0"

      - name: Cache mix deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Hex, rebar and the mix_gleam archive
        run: mix local.hex 2.5.1 --force && mix local.rebar --force && mix archive.install hex mix_gleam 0.6.2 --force
      - run: mix deps.get
      - name: Elixir tests
        # Including the slow ones a laptop skips: whole matches played out
        # at random, and clocks that have to run out in real time.
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: mix test --partitions 4 --include slow

  # Runs alongside the suites, not after them: the jobs are independent,
  # and CI is green when all are. A red answer comes in the time of the
  # slowest job, not the sum.
  #
  # The smokes used to be steps of one job sharing one server. Sharing was
  # never the point -- it was that a matrix costs a whole setup per shard
  # (containers, the browser, a database, the asset build: ~1m50s of the
  # job's 4m20s). Three shards pay that three times over and still answer
  # in half the time, and on a public repository the runner minutes are
  # free. Each shard brings up its own server against its own database.
  #
  # Grouped by measured duration rather than by subject, so they finish
  # together: replay alone is 44s of the 148s all eight take.
  browser:
    name: Playwright smokes (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      # One shard failing should not cancel the others: the useful answer is
      # every smoke that is broken, not the first one.
      fail-fast: false
      matrix:
        include:
          # Arranges its own finished match (mix run setup.exs); the
          # analysis is stubbed in the browser, so no engine is needed.
          - shard: replay
            smokes: >-
              playwright/test-backgammon-replay/test.js
              playwright/test-guest-prefill/test.js
          # test-accounts signs in by email; the mail is read from
          # /dev/last-login.
          - shard: board
            smokes: >-
              playwright/test-backgammon-board/test.js
              playwright/test-accounts/test.js
              playwright/test-backgammon-smoke/test.js
          # test-backgammon-dance arranges its own danced room
          # (mix run setup.exs).
          - shard: dance
            smokes: >-
              playwright/test-backgammon-dance/test.js
              playwright/test-backgammon-landscape/test.js
              playwright/test-spa-landing/test.js
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.2"
          gleam-version: "1.13.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Cache mix deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: mix-${{ runner.os }}-

      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Hex, rebar and the mix_gleam archive
        run: mix local.hex 2.5.1 --force && mix local.rebar --force && mix archive.install hex mix_gleam 0.6.2 --force
      - run: mix deps.get
      - run: mix assets.build
      - name: Dev database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet
      - name: Start the server
        run: |
          mix phx.server > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:4400/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4400/ || (cat server.log && exit 1)
      # Which smokes this shard runs is decided in the matrix above. Note
      # `bin/check --browser` runs four more that CI never has -- home,
      # puzzle, puzzles-cards and puzzles-hub -- so a green CI is a weaker
      # statement than a green local check.
      - name: Smokes
        run: |
          for smoke in ${{ matrix.smokes }}; do
            echo "::group::$smoke"
            node "$smoke"
            echo "::endgroup::"
          done
      - name: Server log
        if: failure()
        run: cat server.log
