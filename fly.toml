# fly.toml app configuration file generated for oskol on 2025-11-08T18:42:40-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oskol'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[deploy]
  # There is one local room owner. Stop it before its replacement starts so
  # boot-time migrations and in-memory rooms can never overlap across builds.
  strategy = 'immediate'

[env]
  PHX_HOST = 'oskol.io'
  PORT = '8080'
  # Fly's private network (where the Managed Postgres pgbouncer lives) is IPv6.
  ECTO_IPV6 = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
